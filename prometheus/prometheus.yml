global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Chargement des règles d'alerte
rule_files:
  - /etc/prometheus/rules/*.yml

# Envoi des alertes vers Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]

  # Blackbox : sonde HTTP sur Nginx (latence + disponibilité)
  - job_name: "blackbox-nginx"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:80
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Blackbox : sonde TCP sur MariaDB (disponibilité port 3306)
  - job_name: "blackbox-mariadb"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mariadb:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
