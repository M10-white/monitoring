groups:
  - name: container_alerts
    rules:

      # Règle 1 : Conteneur critique arrêté
      # Blackbox sonde HTTP (nginx) et TCP (mariadb) toutes les 15s.
      # probe_success == 0 dès que le port ne répond plus → alerte quasi-immédiate.
      - alert: ContainerDown
        expr: probe_success{job=~"blackbox-nginx|blackbox-mariadb"} == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Conteneur {{ $labels.instance }} injoignable"
          description: "La sonde Blackbox ne peut plus atteindre {{ $labels.instance }} (job: {{ $labels.job }})."

      # Règle 2 : Disque MariaDB trop plein (> 100 MB)
      - alert: DatabaseDiskFull
        expr: container_fs_usage_bytes{name="mariadb"} > 100 * 1024 * 1024
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Disque MariaDB élevé : {{ $value | humanize }}B"
          description: "Le conteneur MariaDB utilise {{ $value | humanize }}B d'espace disque. Risque de saturation."

      # Règle 3 : Latence Nginx > 500ms (mesurée par Blackbox Exporter)
      - alert: NginxHighLatency
        expr: probe_duration_seconds{job="blackbox-nginx"} > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latence Nginx > 500ms ({{ $value }}s)"
          description: "Le temps de réponse HTTP de Nginx dépasse 500ms depuis 1 minute."
